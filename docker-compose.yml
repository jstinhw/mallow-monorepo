services:
  postgres:
    image: postgres:16-alpine
    container_name: graviton-postgres
    environment:
      POSTGRES_USER: graviton
      POSTGRES_PASSWORD: graviton_dev
      POSTGRES_DB: graviton
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graviton"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graviton

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: graviton-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: graviton
      RABBITMQ_DEFAULT_PASS: graviton_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graviton

  graviton-server:
    build:
      context: .
      dockerfile: graviton/apps/server/Dockerfile
    image: graviton-server:local
    container_name: graviton-server
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://graviton:graviton_dev@postgres:5432/graviton
      RABBITMQ_URL: amqp://graviton:graviton_dev@rabbitmq:5672
      QUOTER_URL: http://graviton-quoter:3002
      RELAYER_URL: http://graviton-relayer-api:3001
      PORT: 3000
      NODE_ENV: development
      LOG_LEVEL: debug
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - graviton

  graviton-relayer-api:
    build:
      context: .
      dockerfile: graviton/apps/relayer/Dockerfile.api
    image: graviton-relayer-api:local
    container_name: graviton-relayer-api
    ports:
      - "3001:3001"
    environment:
      RABBITMQ_URL: amqp://graviton:graviton_dev@rabbitmq:5672
      PORT: 3001
      NODE_ENV: development
      LOG_LEVEL: debug
      # Set these in .env — see .env.example
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY}
      ZERODEV_API_KEY: ${ZERODEV_API_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - graviton

  graviton-relayer-worker:
    build:
      context: .
      dockerfile: graviton/apps/relayer/Dockerfile.worker
    image: graviton-relayer-worker:local
    container_name: graviton-relayer-worker
    environment:
      RABBITMQ_URL: amqp://graviton:graviton_dev@rabbitmq:5672
      NODE_ENV: development
      LOG_LEVEL: debug
      WORKER_CONCURRENCY: 5
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY}
      ZERODEV_API_KEY: ${ZERODEV_API_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - graviton

  graviton-quoter:
    build:
      context: .
      dockerfile: graviton/apps/quoter/Dockerfile
    image: graviton-quoter:local
    container_name: graviton-quoter
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: development
      LOG_LEVEL: debug
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY}
    restart: unless-stopped
    networks:
      - graviton

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  graviton:
    driver: bridge
